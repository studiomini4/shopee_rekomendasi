<html lang="id">
<head>

    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .shop-card { 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        @media (min-width: 640px) {
            .shop-card:hover { 
                transform: translateY(-4px); 
                box-shadow: 0 12px 20px -8px rgba(0, 0, 0, 0.08);
            }
        }
        .shop-card:active { transform: scale(0.98); }
        
        /* PENGATURAN BACKGROUND DASBOR RESPONSIF */
        .gradient-premium { 
            background-image: url('hp.webp'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        @media (min-width: 640px) {
            .gradient-premium { 
                background-image: url('desktop.webp'); 
            }
        }

        /* EFEK LIST/GARIS TEPI PUTIH SOLID (SEKARANG BERLAKU DI HP & DESKTOP) */
        .text-outline {
            text-shadow: 
                -1.5px -1.5px 0 #ffffff,  
                 1.5px -1.5px 0 #ffffff,
                -1.5px  1.5px 0 #ffffff,
                 1.5px  1.5px 0 #ffffff;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        #category-tags { cursor: grab; }
        #category-tags:active { cursor: grabbing; }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen antialiased relative">

    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5K23VWBG"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <audio id="bgMusic"></audio>

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 px-4 py-3.5">
        <div class="max-w-xl md:max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-slate-900 font-black text-lg tracking-tight flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                AFILIASI SHOPEE
            </h1>
            
            <div class="flex items-center gap-2">
                <button id="btnInstall" class="hidden text-[10px] bg-amber-500 hover:bg-amber-600 text-slate-950 px-2.5 py-1.5 rounded-lg font-bold uppercase transition-all duration-200 tracking-wider items-center gap-1 shadow-sm">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                    Pasang
                </button>
                
                <a href="https://shopee.co.id/studiomini" target="_blank" class="text-[10px] bg-slate-100 px-2.5 py-1.5 rounded-lg font-bold text-slate-600 uppercase hover:bg-amber-500 hover:text-slate-950 transition-all duration-200 block cursor-pointer tracking-wider">
                    studiomini
                </a>
            </div>
        </div>
    </nav>

    <section class="gradient-premium px-6 pt-12 pb-20 md:py-24 text-center relative overflow-hidden">
        <div class="absolute inset-0 bg-black/5 z-0"></div>
        
        <div class="max-w-xl md:max-w-4xl mx-auto relative z-10">
            
            <h2 class="text-2xl md:text-5xl font-black tracking-tight mb-3 text-slate-900 text-outline">
                SELAMAT DATANG 👋
            </h2>
            
            <p class="text-xs md:text-base text-slate-800 leading-relaxed font-extrabold max-w-sm md:max-w-2xl mx-auto text-outline">
                Selamat berbelanja, kami adalah mitra shopee yang terdaftar sebagai afiliasi yang sah.
            </p>
            
            <div class="mt-4">
                <div class="bg-amber-500 text-slate-950 border border-amber-600 px-4 py-2 md:px-6 md:py-2.5 rounded-full inline-block text-[11px] md:text-xs font-black shadow-md select-none cursor-default">
                    Klik Toko Untuk Melihat Produk 
                </div>
            </div>
        </div>
    </section>

    <main class="max-w-xl md:max-w-7xl mx-auto px-4 flex-grow w-full -mt-8 relative z-20">
        
        <div id="audioPlayer" class="w-full bg-white/95 backdrop-blur-md py-1 px-2.5 rounded-xl shadow-md border border-slate-100 flex items-center justify-between gap-2 mb-3 select-none h-9">
            <div class="flex items-center gap-1.5 overflow-hidden min-w-0 flex-1">
                <span class="flex h-1.5 w-1.5 relative shrink-0">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-amber-500"></span>
                </span>
                <span id="audioStatus" class="text-[10px] font-bold text-slate-600 truncate">Memuat...</span>
            </div>
            
            <div class="flex items-center gap-0.5 bg-slate-50 p-0.5 rounded-lg border border-slate-100 shrink-0">
                <button onclick="prevTrack()" class="w-5 h-5 bg-white text-slate-500 rounded flex items-center justify-center hover:bg-slate-100 active:scale-90 border border-slate-100 transition-all">
                    <svg class="w-2.5 h-2.5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>

                <button id="audioBtn" onclick="toggleAudio()" class="w-5 h-5 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded flex items-center justify-center shadow-sm transition-all duration-200 active:scale-95">
                    <svg id="playIcon" class="w-2.5 h-2.5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" class="w-2.5 h-2.5 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>

                <button onclick="nextTrack()" class="w-5 h-5 bg-white text-slate-500 rounded flex items-center justify-center hover:bg-slate-100 active:scale-90 border border-slate-100 transition-all">
                    <svg class="w-2.5 h-2.5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm9-12v12h2V6z"/></svg>
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-4 shadow-xl shadow-slate-200/50 border border-slate-100 mb-6">
            <div class="relative mb-3.5">
                <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Cari nama toko atau produk..." 
                class="w-full bg-slate-50/50 border border-slate-200 rounded-xl px-11 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 focus:bg-white transition-all placeholder:text-slate-400">
                <svg class="w-5 h-5 absolute left-4 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            
            <div id="category-tags" class="flex flex-nowrap gap-2 overflow-x-auto no-scrollbar pb-1.5 select-none scroll-smooth">
            </div>

            <p class="text-[10px] text-slate-400 font-medium tracking-wide mt-1 flex items-center justify-center gap-1.5 select-none opacity-80 w-full text-center">
                <svg class="w-3 h-3 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Geser untuk melihat kategori lain
                <svg class="w-3 h-3 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </p>
        </div>

        <div id="shop-list">
            <p id="loading-text" class="text-center text-sm font-medium text-slate-400 py-12 animate-pulse">Menghubungkan ke Google Sheets...</p>
        </div>

        <div id="pagination-container" class="mt-8 grid grid-cols-2 gap-4 pb-12" style="display: none;">
            <button id="prevBtn" onclick="changePage(-1)" class="bg-white border border-slate-200 py-3 rounded-xl font-bold text-sm text-slate-600 shadow-sm transition-all active:bg-slate-50 disabled:opacity-30 disabled:pointer-events-none">
                ← Sebelumnya
            </button>
            <button id="nextBtn" onclick="changePage(1)" class="bg-slate-900 border border-slate-900 py-3 rounded-xl font-bold text-sm text-white shadow-md shadow-slate-900/10 transition-all active:bg-slate-800 disabled:opacity-30 disabled:pointer-events-none">
                Selanjutnya →
            </button>
        </div>
    </main>

    <footer class="text-center py-8 border-t border-slate-100 bg-white mt-auto">
        <p class="text-[9px] text-slate-400 font-bold tracking-[0.2em] uppercase mb-1">Terima kasih sudah berkunjung</p>
        <p class="text-xs text-slate-700 font-extrabold tracking-wide">studiomini &bull; 2026</p>
    </footer>

    <script>
        const daftarAudio = [
            { judul: "Arrohman-Ustad Abdul Qadir", file: "surah 1.ogg" },
            { judul: "Al Waqiah-Ustad Abdul Qadir", file: "surah 2.ogg" },
            { judul: "Muhammad Al Muqit-The Way", file: "nasyid 1.ogg" },
            { judul: "Muhammad Al Muqi-I Rise", file: "nasyid 2.ogg" },
            { judul: "Muhammad Al Muqi-The Voice of reciter", file: "nasyid 3.ogg" },
            { judul: "Dzikir Pagi", file: "dzikir.mp3" }
        ];

        // Mengacak urutan audio secara acak
        for (let i = daftarAudio.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [daftarAudio[i], daftarAudio[j]] = [daftarAudio[j], daftarAudio[i]];
        }

        let indexAudioSekarang = 0;
        const audio = document.getElementById('bgMusic');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const statusText = document.getElementById('audioStatus');

        function muatAudio(index) {
            if (daftarAudio.length === 0) return;
            audio.src = daftarAudio[index].file;
            statusText.textContent = daftarAudio[index].judul;
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.classList.add('hidden');
                    pauseIcon.classList.remove('hidden');
                }).catch(err => console.log("Interaksi user diperlukan"));
            } else {
                audio.pause();
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        function nextTrack() {
            indexAudioSekarang = (indexAudioSekarang + 1) % daftarAudio.length;
            muatAudio(indexAudioSekarang);
            audio.play().then(() => {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            }).catch(err => {});
        }

        function prevTrack() {
            indexAudioSekarang = (indexAudioSekarang - 1 + daftarAudio.length) % daftarAudio.length;
            muatAudio(indexAudioSekarang);
            audio.play().then(() => {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            }).catch(err => {});
        }

        audio.addEventListener('ended', nextTrack);
        muatAudio(indexAudioSekarang);

        // --- OPTIMASI PENGAMBILAN DATA DATABASE GOOGLE SHEETS VIA ASYNC FETCH ---
        const URL_SHEETS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRwRYel94cUe9przoVOURDHLMtfOhSB0m4rAAO-kYZjp2a1KAIhXFSbYqtImttg5Yv_L7D49I-rD6jl/pub?output=csv";

        let shops = [];
        let categories = ["Semua"];
        let filtered = [], curPage = 1, perPage = 8, selectedCategory = "Semua"; 

        async function muatDataOnline() {
            try {
                // cache: "no-cache" dikombinasikan dengan pemanggilan DOMContentLoaded agar rendering struktur selesai lebih dulu
                const response = await fetch(URL_SHEETS_CSV, { cache: "no-cache" });
                const dataTeks = await response.text();
                const semuaBaris = dataTeks.split('\n').slice(1); 

                shops = semuaBaris.map(baris => {
                    const kolom = baris.split(',');
                    if (kolom.length >= 5) {
                        return {
                            n: kolom[0] ? kolom[0].replace(/"/g, "").trim() : "", 
                            d: kolom[1] ? kolom[1].replace(/"/g, "").trim() : "", 
                            i: kolom[2] ? kolom[2].trim() : "",                  
                            l: kolom[3] ? kolom[3].trim() : "",                  
                            k: kolom[4] ? kolom[4].trim() : ""                    
                        };
                    }
                    return null;
                }).filter(item => item !== null && item.n !== "");

                // Mengacak daftar toko agar variatif
                for (let i = shops.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shops[i], shops[j]] = [shops[j], shops[i]];
                }

                categories = ["Semua", ...new Set(shops.map(s => s.k))];
                filtered = [...shops];

                const loadingText = document.getElementById('loading-text');
                if(loadingText) loadingText.remove();

                renderCategories();
                render();

            } catch (error) {
                console.error("Gagal memuat data:", error);
                const listContainer = document.getElementById('shop-list');
                if (listContainer) {
                    listContainer.innerHTML = `<p class="text-center text-sm font-medium text-red-500 py-12">Gagal memuat data toko.</p>`;
                }
            }
        }

        function renderCategories() {
            const tagCont = document.getElementById('category-tags');
            if(!tagCont) return;
            tagCont.innerHTML = categories.map(cat => {
                const isActive = cat === selectedCategory;
                return `
                    <button onclick="filterCategory('${cat}')" class="text-xs font-bold px-4 py-2 rounded-xl border transition-all duration-150 whitespace-nowrap
                    ${isActive ? 'bg-amber-500 text-slate-950 border-amber-500' : 'bg-slate-50 text-slate-500 border-slate-200'}">
                        ${cat}
                    </button>
                `;
            }).join('');
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            document.getElementById('searchInput').value = "";
            applyFilter();
        }

        function applyFilter() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            filtered = shops.filter(s => {
                return (s.n.toLowerCase().includes(q) || s.k.toLowerCase().includes(q) || s.d.toLowerCase().includes(q)) && (selectedCategory === "Semua" || s.k === selectedCategory);
            });
            curPage = 1;
            renderCategories();
            render();
        }

        function handleSearch() {
            if(document.getElementById('searchInput').value !== "") selectedCategory = "Semua";
            applyFilter();
        }

        function render() {
            const cont = document.getElementById('shop-list');
            if(!cont) return;
            const start = (curPage - 1) * perPage;
            const items = filtered.slice(start, start + perPage);
            const total = Math.ceil(filtered.length / perPage);

            if(items.length === 0) {
                cont.className = "block w-full text-center";
                cont.innerHTML = `<p class="text-sm font-medium text-slate-400 py-12">Tidak ada toko yang cocok...</p>`;
            } else {
                cont.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3.5 w-full";
                cont.innerHTML = items.map(s => `
                    <a href="${s.l}" target="_blank" class="shop-card bg-white p-3.5 rounded-2xl flex flex-col items-center text-center shadow-sm border border-slate-100 justify-between h-full group">
                        <div class="w-full flex flex-col items-center">
                            <div class="w-20 h-20 rounded-xl overflow-hidden bg-slate-50 mb-3 flex items-center justify-center border border-slate-100 p-1">
                                <img src="${s.i}" class="w-full h-full rounded-lg object-cover" loading="lazy">
                            </div>
                            <span class="text-[8px] font-black text-amber-600 bg-amber-50 px-2 py-0.5 rounded mb-2 uppercase">${s.k}</span>
                            <h3 class="text-xs font-bold line-clamp-2 text-slate-900 group-hover:text-amber-600 transition-colors px-1 w-full leading-snug mb-1">${s.n}</h3>
                        </div>
                        <p class="text-[10px] text-slate-400 font-medium line-clamp-1 w-full px-1 mt-2">${s.d}</p>
                    </a>
                `).join('');
            }

            document.getElementById('prevBtn').disabled = curPage === 1;
            document.getElementById('nextBtn').disabled = curPage === total || total === 0;
            document.getElementById('pagination-container').style.display = total <= 1 ? 'none' : 'grid';
        }

        function changePage(dir) { 
            curPage += dir; render(); 
            window.scrollTo({top: 0, behavior: 'smooth'}); 
        }

        // Menjalankan pencarian database secara background pasca halaman selesai dirender dasar
        window.addEventListener('DOMContentLoaded', muatDataOnline);

        const categoryCont = document.getElementById('category-tags');
        let isCatDown = false;
        let catStartX;
        let catScrollLeft;
        let isDraggingCat = false;

        categoryCont.addEventListener('mousedown', (e) => {
            isCatDown = true;
            isDraggingCat = false;
            catStartX = e.pageX - categoryCont.offsetLeft;
            catScrollLeft = categoryCont.scrollLeft;
        });

        categoryCont.addEventListener('mouseleave', () => { isCatDown = false; });
        categoryCont.addEventListener('mouseup', () => { isCatDown = false; });

        categoryCont.addEventListener('mousemove', (e) => {
            if (!isCatDown) return;
            isDraggingCat = true;
            e.preventDefault();
            const x = e.pageX - categoryCont.offsetLeft;
            const walk = (x - catStartX) * 1.5;
            categoryCont.scrollLeft = catScrollLeft - walk;
        });

        categoryCont.addEventListener('click', (e) => {
            if (isDraggingCat) {
                e.preventDefault();
                e.stopPropagation();
                isDraggingCat = false;
            }
        }, true);

        // --- HANDLING SISTEM INSTALASI PWA PADA BROWSER ---
        let deferredPrompt;
        const btnInstall = document.getElementById('btnInstall');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); 
            deferredPrompt = e;  
            if(btnInstall) btnInstall.style.display = 'flex'; 
        });

        if(btnInstall) {
            btnInstall.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    await deferredPrompt.userChoice;
                    deferredPrompt = null;
                    btnInstall.style.display = 'none'; 
                }
            });
        }

        window.addEventListener('appinstalled', () => {
            if(btnInstall) btnInstall.style.display = 'none'; 
            deferredPrompt = null;
        });

        // --- REGISTER SERVICE WORKER SECARA EFISIEN TANPA BEBAN ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'mitra-belanja-v2';
                    self.addEventListener('install', (e) => {
                        e.waitUntil(caches.open(CACHE_NAME).then((c) => c.addAll(['index.html', 'manifest.json'])));
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            });
        }
    </script>
</body>
</html>
