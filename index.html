    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoping Shopee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .shop-card { 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        @media (min-width: 640px) {
            .shop-card:hover { 
                transform: translateY(-4px); 
                box-shadow: 0 12px 20px -8px rgba(0, 0, 0, 0.08);
            }
        }
        .shop-card:active { transform: scale(0.98); }
        .gradient-premium { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* CSS indikasi kursor drag pada desktop */
        #category-tags {
            cursor: grab;
        }
        #category-tags:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen antialiased relative">

    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5K23VWBG"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <audio id="bgMusic"></audio>

    <div id="audioPlayer" class="fixed top-24 right-6 z-50 flex items-center bg-white/95 backdrop-blur-md p-2 rounded-full shadow-xl border border-slate-200/80 gap-2 pl-4 pr-2 max-w-sm cursor-move select-none touch-none">
        <div class="flex flex-col text-left max-w-[120px] sm:max-w-[160px]">
            <span class="text-[9px] font-bold text-slate-400 tracking-wider uppercase">Putar Audio</span>
            <span id="audioStatus" class="text-[11px] font-extrabold text-slate-700 truncate">Memuat...</span>
        </div>
        
        <div class="flex items-center gap-1 bg-slate-50 p-1 rounded-full border border-slate-100">
            <button onclick="prevTrack()" class="w-7 h-7 bg-white text-slate-600 rounded-full flex items-center justify-center hover:bg-slate-100 active:scale-90 border border-slate-200 transition-all">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>

            <button id="audioBtn" onclick="toggleAudio()" class="w-9 h-9 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-full flex items-center justify-center shadow-md shadow-amber-500/10 transition-all duration-200 active:scale-95">
                <svg id="playIcon" class="w-4 h-4 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pauseIcon" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>

            <button onclick="nextTrack()" class="w-7 h-7 bg-white text-slate-600 rounded-full flex items-center justify-center hover:bg-slate-100 active:scale-90 border border-slate-200 transition-all">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm9-12v12h2V6z"/></svg>
            </button>
        </div>
    </div>

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 px-4 py-3.5">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-slate-900 font-black text-lg tracking-tight flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                MITRA SHOPING DARI SHOPEE
            </h1>
            <a href="https://shopee.co.id/studiomini" target="_blank" class="text-[10px] bg-slate-100 px-2.5 py-1.5 rounded-lg font-bold text-slate-600 uppercase hover:bg-amber-500 hover:text-slate-950 transition-all duration-200 block cursor-pointer tracking-wider">
                studiomini
            </a>
        </div>
    </nav>

    <section class="gradient-premium px-6 pt-10 pb-16 text-white text-center relative overflow-hidden">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(245,158,11,0.15),transparent_50%)]"></div>
        <div class="max-w-xl mx-auto relative z-10">
            <h2 class="text-2xl font-black tracking-tight mb-2">SELAMAT DATANG 👋</h2>
            <p class="text-xs text-slate-300 opacity-90 leading-relaxed font-medium max-w-sm mx-auto">
                Selamat berbelanja, kami adalah mitra shopee yang terdaftar sebagai afiliasi yang sah. <br>
                <span class="bg-white/10 text-amber-400 border border-white/10 px-2.5 py-1 rounded-full mt-3 inline-block font-semibold">
                    Klik Toko Untuk Melihat Produk 
                </span>
            </p>
        </div>
    </section>

    <main class="max-w-xl mx-auto px-4 flex-grow w-full -mt-8 relative z-20">
        
        <div class="bg-white rounded-2xl p-4 shadow-xl shadow-slate-200/50 border border-slate-100 mb-6">
            <div class="relative mb-3.5">
                <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Cari nama toko atau produk..." 
                class="w-full bg-slate-50/50 border border-slate-200 rounded-xl px-11 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 focus:bg-white transition-all placeholder:text-slate-400">
                <svg class="w-5 h-5 absolute left-4 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            
            <div id="category-tags" class="flex flex-nowrap gap-2 overflow-x-auto no-scrollbar pb-3 select-none scroll-smooth">
            </div>
        </div>

        <div id="shop-list" class="grid grid-cols-2 gap-3.5">
        </div>

        <div id="pagination-container" class="mt-8 grid grid-cols-2 gap-4 pb-12">
            <button id="prevBtn" onclick="changePage(-1)" class="bg-white border border-slate-200 py-3 rounded-xl font-bold text-sm text-slate-600 shadow-sm transition-all active:bg-slate-50 disabled:opacity-30 disabled:pointer-events-none">
                ← Sebelumnya
            </button>
            <button id="nextBtn" onclick="changePage(1)" class="bg-slate-900 border border-slate-900 py-3 rounded-xl font-bold text-sm text-white shadow-md shadow-slate-900/10 transition-all active:bg-slate-800 disabled:opacity-30 disabled:pointer-events-none">
                Selanjutnya →
            </button>
        </div>
    </main>

    <footer class="text-center py-8 border-t border-slate-100 bg-white mt-auto">
        <p class="text-[9px] text-slate-400 font-bold tracking-[0.2em] uppercase mb-1">Terima kasih sudah berkunjung</p>
        <p class="text-xs text-slate-700 font-extrabold tracking-wide">studiomini &bull; 2026</p>
    </footer>

    <script>
        // ==========================================
        // BAGIAN 1: PENGATURAN PLAYLIST MP3 ANDA
        // ==========================================
        const daftarAudio = [
            { judul: "Arrohman-Ustad Abdul Qadir", file: "surah 1.ogg" },
            { judul: "Al Waqiah-Ustad Abdul Qadir", file: "surah 2.ogg" },
            { judul: "Nasyid Pilihan", file: "nasyid1.mp3" },
            { judul: "Dzikir Pagi", file: "dzikir.mp3" }
        ];

        let indexAudioSekarang = 0;
        const audio = document.getElementById('bgMusic');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const statusText = document.getElementById('audioStatus');

        function muatAudio(index) {
            if (daftarAudio.length === 0) return;
            audio.src = daftarAudio[index].file;
            statusText.textContent = daftarAudio[index].judul;
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.classList.add('hidden');
                    pauseIcon.classList.remove('hidden');
                }).catch(err => console.log("Interaksi user diperlukan terlebih dahulu"));
            } else {
                audio.pause();
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        function nextTrack() {
            indexAudioSekarang = (indexAudioSekarang + 1) % daftarAudio.length;
            muatAudio(indexAudioSekarang);
            audio.play();
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
        }

        function prevTrack() {
            indexAudioSekarang = (indexAudioSekarang - 1 + daftarAudio.length) % daftarAudio.length;
            muatAudio(indexAudioSekarang);
            audio.play();
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
        }

        audio.addEventListener('ended', function() {
            nextTrack();
        });

        muatAudio(indexAudioSekarang);


        // ==========================================
        // BAGIAN 2: DATA KATALOG TOKO DAN FITURNYA
        // ==========================================
        const daftarToko = [
            "Moslem Sunah Bandung | Gamis Wanita | https://cf.shopee.sg/file/id-11134216-7ra0o-mclagnoh0r3jf4 | https://s.shopee.co.id/6VIfxtajs9 | Fashion",
            "Kurta Pria | Baju Kurta | https://down-tx-id.img.susercontent.com/id-11134216-7r98s-m037np9mcrn30a_tn.webp | https://s.shopee.co.id/6AfpZWWMS1 | Fashion",
            "Kurta Sunnah Bandung | Baju Kurta Bandung | https://down-tx-id.img.susercontent.com/id-11134216-7rase-m3i0q0k1cqsf72_tn.webp | https://s.shopee.co.id/2LT712sP0D | Fashion",
            "Gudang Kurta | Pakaian Muslim | https://down-tx-id.img.susercontent.com/637cee1e7661e334b376831d6bcd76ea_tn.webp | https://s.shopee.co.id/9zsY9G9GZm | Fashion",
            "Talulla Koko | Kurta Premium | https://down-tx-id.img.susercontent.com/id-11134216-8224q-mjiaadohor2c97_tn.webp | https://s.shopee.co.id/3B2E0pwEzh | Fashion",
            "CV KIRANA HASNA ELEKTRONIK | Toko Elektronik & Spare part| https://down-tx-id.img.susercontent.com/id-11134216-7r98w-lxnzgirjaq7ib7_tn.webp | https://s.shopee.co.id/7Krn1snX0I | Elektronik",
            "BASTIAN TAMA ELEKTRONIK | Toko Elektronik & Alat-alatnya | https://down-tx-id.img.susercontent.com/id-11134216-7r98t-lp2yj91ek0zb61_tn.webp | https://s.shopee.co.id/4LEBSWzRwx | Elektronik",
            "KUSUMA ABADI ELEKTRONIK | Elektronik & Spare part elektronik | https://down-tx-id.img.susercontent.com/542d642f85672047097052e965a21df9_tn.webp | https://s.shopee.co.id/9fFhoYVR2s | Elektronik",
            "Grosir Murah JKT 2| Kaos & Pakaian Distro | https://down-tx-id.img.susercontent.com/id-11134233-7r991-lyrx47vk8m3f0e_tn.webp | https://s.shopee.co.id/10xjUsMM4c | Fashion",
            "De Essential Official Store | Perabotan Rumah Tangga | https://down-tx-id.img.susercontent.com/db99fc902e64d3fe778f84d5b4d70f09_tn.webp | https://s.shopee.co.id/20qGh3JCyS | Perabot",
            "Madia | Perlengkapan Rumah Tangga | https://down-tx-id.img.susercontent.com/id-11134216-8224o-mg6gibco0360ca_tn.webp | https://s.shopee.co.id/4qAS4QQRy1 | Rumah Tangga",
            "Goto Living | Rumah tangga & Fashion | https://down-tx-id.img.susercontent.com/f8b16c6c2102ca331e4a4aaaf281abc3_tn.webp | https://s.shopee.co.id/4fr1sMpY2w | Rumah Tangga",
            "Smallsun | Elektronik & Handphone | https://down-tx-id.img.susercontent.com/id-11134216-7r98u-lnmqnbvh48l88f_tn.webp | https://s.shopee.co.id/8fNAdsscil | Elektronik",
            "Calista Official | Perabotan & toples | https://down-tx-id.img.susercontent.com/d5cea5d2d66737c67833fbb2f23af20c_tn.webp | https://s.shopee.co.id/1gDQJHlSMK | Perabot",
            "Yoi-shop | Perabotan Rumah Tangga | https://down-tx-id.img.susercontent.com/1c4ff569de3b6024f294c6f5d12f85bb_tn.webp | https://s.shopee.co.id/8KkKFlH6pH | Perabot",
            "SIV Homedeco | Perabotan Rumah Tangga | https://down-tx-id.img.susercontent.com/8d91cb50bddbcd2b3f8c3ae5ce2ba747_tn.webp | https://s.shopee.co.id/5fm8s6etJw | Perabot",
            "Faeyza Comp Official | Komputer & Laptop | https://down-tx-id.img.susercontent.com/id-11134233-7qul5-ljqt9ge3b3my8e_tn.webp | https://s.shopee.co.id/AKXyRtwTv0 | Elektronik",
            "Grage Shop | Fashion muslimah | https://down-tx-id.img.susercontent.com/b939bc0d44777d8d9022001b598b6028_tn.webp | https://s.shopee.co.id/6fegaJOMPk | Fashion",
            "Putri Rinti Collection | Fashion muslimah | https://down-tx-id.img.susercontent.com/a6120563552db1447bc4c83696ecbcb4_tn.webp | https://s.shopee.co.id/8pjBAc2G67 | Fashion",
            "Hippo Land | Fashion bayi | https://down-tx-id.img.susercontent.com/58dccd0b35aa0aae11ffd214c9a4b3a5_tn.webp | https://s.shopee.co.id/6L1qC8Q8Q2 | Fashion",
            "Zamza | Undangan & Buku Tamu | https://down-tx-id.img.susercontent.com/10e0546965e07eb1ce39ced32c2aee1e_tn.webp | https://s.shopee.co.id/8V6LpkOFuw | Undangan",
            "Undangan Pernikahan Jakarta | Undangan & Buku Tamu | https://down-tx-id.img.susercontent.com/id-11134216-7r98p-lm4rpz3n5vrzc1_tn.webp | https://s.shopee.co.id/3LOFheQeh4 | Undangan",
            "Triumph International | Peralatan berkemah & Olahraga | https://down-ws-id.img.susercontent.com/b7a62ac331d235af1f48c487ba54c53c_tn.webp | https://s.shopee.co.id/3g17M54iqA | Lain-lain",
            "Korvo Official Store | Sepeda Listrik, Payung Besar dll | https://down-ws-id.img.susercontent.com/id-11134216-8224r-mk6f8i0wm4g27e_tn.webp | https://s.shopee.co.id/AKY1Ih5iqr | Lain-lain",
        ];

        const shops = daftarToko.map(item => {
            const p = item.split('|').map(x => x.trim());
            return { n: p[0], d: p[1], i: p[2], l: p[3], k: p[4] };
        });

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        shuffleArray(shops);

        const categories = ["Semua", ...new Set(shops.map(s => s.k))];
        let filtered = [...shops], curPage = 1, perPage = 4, selectedCategory = "Semua";

        // PERBAIKAN 2: Mengunci posisi scroll horizontal agar tidak kembali ke awal saat fungsi dijalankan
        function renderCategories() {
            const tagCont = document.getElementById('category-tags');
            const currentScrollPosition = tagCont.scrollLeft; // Tangkap posisi scroll saat ini

            tagCont.innerHTML = categories.map((cat, index) => {
                const isActive = cat === selectedCategory;
                const isLast = index === categories.length - 1;
                // PERBAIKAN 3: Menambahkan margin kanan khusus (mr-4) pada item terakhir agar teks ujung kanan tidak terpotong tepi layar
                return `
                    <button onclick="filterCategory('${cat}')" class="text-xs font-bold px-4 py-2 rounded-xl border transition-all duration-150 whitespace-nowrap ${isLast ? 'mr-4' : ''}
                    ${isActive ? 'bg-amber-500 text-slate-950 border-amber-500 shadow-sm shadow-amber-500/20' : 'bg-slate-50 text-slate-500 border-slate-200 hover:bg-slate-100 hover:text-slate-700'}" >
                        ${cat}
                    </button>
                `;
            }).join('');

            tagCont.scrollLeft = currentScrollPosition; // Terapkan kembali posisi scroll semula
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            document.getElementById('searchInput').value = "";
            applyFilter();
        }

        function applyFilter() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            
            filtered = shops.filter(s => {
                const matchQuery = s.n.toLowerCase().includes(q) || s.k.toLowerCase().includes(q) || s.d.toLowerCase().includes(q);
                const matchCategory = selectedCategory === "Semua" || s.k === selectedCategory;
                return matchQuery && matchCategory;
            });

            curPage = 1;
            renderCategories();
            render();
        }

        function handleSearch() {
            if(document.getElementById('searchInput').value !== "") {
                selectedCategory = "Semua";
            }
            applyFilter();
        }

        function render() {
            const cont = document.getElementById('shop-list');
            const start = (curPage - 1) * perPage;
            const items = filtered.slice(start, start + perPage);
            const total = Math.ceil(filtered.length / perPage);

            if(items.length === 0) {
                cont.innerHTML = `<p class="col-span-2 text-center text-sm font-medium text-slate-400 py-12">Tidak ada toko yang cocok...</p>`;
            } else {
                cont.innerHTML = items.map(s => `
                    <a href="${s.l}" target="_blank" class="shop-card bg-white p-3.5 rounded-2xl flex flex-col items-center text-center shadow-sm border border-slate-100 justify-between h-full group">
                        <div class="w-full flex flex-col items-center">
                            <div class="w-20 h-20 rounded-xl overflow-hidden bg-slate-50 border border-slate-100 mb-3 p-1 flex items-center justify-center">
                                <img src="${s.i}" class="w-full h-full rounded-lg object-cover" loading="lazy">
                            </div>
                            <span class="text-[8px] font-black tracking-widest text-amber-600 bg-amber-50 px-2 py-0.5 rounded mb-2 uppercase">${s.k}</span>
                            <h3 class="text-xs font-bold line-clamp-2 text-slate-900 group-hover:text-amber-600 transition-colors px-1 w-full leading-snug mb-1">${s.n}</h3>
                        </div>
                        <p class="text-[10px] text-slate-400 font-medium line-clamp-1 w-full px-1 mt-2">${s.d}</p>
                    </a>
                `).join('');
            }

            document.getElementById('prevBtn').disabled = curPage === 1;
            document.getElementById('nextBtn').disabled = curPage === total || total === 0;
            document.getElementById('pagination-container').style.display = total <= 1 ? 'none' : 'grid';
        }

        function changePage(dir) { 
            curPage += dir; render(); 
            window.scrollTo({top: 0, behavior: 'smooth'}); 
        }

        renderCategories();
        render();


        // ==========================================
        // BAGIAN 3: FITUR DRAG & DROP AUDIO PLAYER
        // ==========================================
        const player = document.getElementById("audioPlayer");
        let isDragging = false;
        let currentX, currentY, initialX, initialY;
        let xOffset = 0, yOffset = 0;

        player.addEventListener("touchstart", dragStart, { passive: false });
        player.addEventListener("touchend", dragEnd, { passive: false });
        player.addEventListener("touchmove", drag, { passive: false });

        player.addEventListener("mousedown", dragStart);
        player.addEventListener("mouseup", dragEnd);
        player.addEventListener("mousemove", drag);

        function dragStart(e) {
            if (e.target.closest('button')) return;

            if (e.type === "touchstart") {
                initialX = e.touches[0].clientX - xOffset;
                initialY = e.touches[0].clientY - yOffset;
            } else {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
            }
            isDragging = true;
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault(); 
                
                if (e.type === "touchmove") {
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                } else {
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                }

                xOffset = currentX;
                yOffset = currentY;

                player.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        }

        function dragEnd(e) {
            initialX = currentX;
            initialY = currentY;
            isDragging = false;
        }

        // =======================================================
        // BAGIAN PERBAIKAN BARU: MOUSE DRAG SCROLL UNTUK KATEGORI
        // =======================================================
        const categoryCont = document.getElementById('category-tags');
        let isCatDown = false;
        let catStartX;
        let catScrollLeft;
        let isDraggingCat = false;

        categoryCont.addEventListener('mousedown', (e) => {
            isCatDown = true;
            isDraggingCat = false;
            catStartX = e.pageX - categoryCont.offsetLeft;
            catScrollLeft = categoryCont.scrollLeft;
        });

        categoryCont.addEventListener('mouseleave', () => {
            isCatDown = false;
        });

        categoryCont.addEventListener('mouseup', () => {
            isCatDown = false;
        });

        categoryCont.addEventListener('mousemove', (e) => {
            if (!isCatDown) return;
            isDraggingCat = true;
            e.preventDefault();
            const x = e.pageX - categoryCont.offsetLeft;
            const walk = (x - catStartX) * 1.5; // Kecepatan scroll geser mouse
            categoryCont.scrollLeft = catScrollLeft - walk;
        });

        // Mencegah klik button tidak sengaja terpicu saat user murni sedang men-drag mouse
        categoryCont.addEventListener('click', (e) => {
            if (isDraggingCat) {
                e.preventDefault();
                e.stopPropagation();
                isDraggingCat = false;
            }
        }, true);
    </script>
</body>
</html>
